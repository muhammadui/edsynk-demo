<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edsynk — Audit Log</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{canvas:'#F7F9FC',ink:'#0B2A56',charcoal:'#18181B',steel:'#64748B',whisper:'#E2E8F0',blue:'#2177EF',skyblue:'#5C9DF5',wash:'#EAF2FE',mist:'#D3E4FD',confirm:'#16A34A',caution:'#D97706',alert:'#DC2626',excused:'#7C8DA6'},fontFamily:{sans:['Geist','sans-serif'],mono:['"Geist Mono"','monospace']},boxShadow:{soft:'0 1px 2px rgba(11,42,86,0.04), 0 6px 24px rgba(11,42,86,0.05)',lift:'0 1px 3px rgba(11,42,86,0.10), 0 12px 32px rgba(11,42,86,0.12)'}}}}</script>
<style>@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.rise{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}</style>
</head>
<body data-active="Audit Log" data-persona="admin" class="bg-canvas font-sans text-charcoal antialiased">
<div class="flex min-h-screen">
  <div id="sidebar-root"></div>
  <div class="flex-1 min-w-0">
    <header class="h-[60px] bg-white/80 backdrop-blur-md border-b border-whisper/70 flex items-center justify-between px-4 sm:px-7 sticky top-0 z-20">
      <div class="flex items-center gap-3">
        <a href="settings.html" class="h-8 w-8 grid place-items-center rounded-lg hover:bg-mist/40 text-steel" title="Back to Settings"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>
        <h1 class="text-[15px] font-semibold tracking-tight">Audit Log</h1>
        <span class="text-[11.5px] font-medium text-steel bg-canvas ring-1 ring-whisper rounded-full px-2.5 py-1 hidden sm:inline">Immutable</span>
      </div>
      <button onclick="toast('Exporting audit log to CSV…')" class="h-9 px-4 rounded-lg bg-blue text-white text-[13px] font-medium shadow-soft active:translate-y-px">Export log</button>
    </header>

    <main class="p-4 sm:p-7 max-w-[1180px] space-y-5">
      <div class="rise rounded-2xl bg-wash/50 ring-1 ring-mist/60 px-4 py-3 text-[11.5px] text-ink">This is an append-only record of every sensitive action. Entries can never be edited or deleted — not even by the owner. Retained 7 years per NDPA 2023.</div>

      <!-- Filter row -->
      <div class="rise bg-white ring-1 ring-whisper/80 rounded-2xl shadow-soft p-4 flex flex-wrap items-end gap-3">
        <div><label class="text-[10px] font-semibold uppercase tracking-wider text-steel">Actor</label>
          <select id="fActor" onchange="render()" class="mt-1.5 block h-9 rounded-lg border border-whisper bg-canvas px-2.5 text-[12.5px]"><option value="">All actors</option><option>Ustadh Abdullahi</option><option>Mrs. Ngozi Adeyemi</option><option>Mallam Musa Ibrahim</option><option>Mr. Chinedu Okafor</option></select></div>
        <div><label class="text-[10px] font-semibold uppercase tracking-wider text-steel">Action type</label>
          <select id="fAction" onchange="render()" class="mt-1.5 block h-9 rounded-lg border border-whisper bg-canvas px-2.5 text-[12.5px]"><option value="">All actions</option><option>Auth</option><option>Results</option><option>Records</option><option>Finance</option><option>Users</option></select></div>
        <div><label class="text-[10px] font-semibold uppercase tracking-wider text-steel">Date range</label>
          <select class="mt-1.5 block h-9 rounded-lg border border-whisper bg-canvas px-2.5 text-[12.5px]"><option>Last 7 days</option><option>Last 30 days</option><option>This term</option><option>This session</option></select></div>
        <div class="flex-1 min-w-[160px]"><label class="text-[10px] font-semibold uppercase tracking-wider text-steel">Search</label>
          <input id="fSearch" oninput="render()" placeholder="target, IP, keyword…" class="mt-1.5 block w-full h-9 rounded-lg border border-whisper bg-canvas px-3 text-[12.5px]"></div>
        <button onclick="toast('Filters applied')" class="h-9 px-4 rounded-lg bg-ink text-white text-[12.5px] font-medium">Filter</button>
      </div>

      <!-- Table -->
      <section class="rise bg-white ring-1 ring-whisper/80 rounded-2xl shadow-soft overflow-hidden">
        <div class="overflow-x-auto"><table class="w-full text-[12px] min-w-[900px]">
          <thead><tr class="text-left text-[10px] font-semibold uppercase tracking-wider text-steel border-b border-whisper/60 bg-canvas/60">
            <th class="px-6 py-3">Timestamp</th><th class="px-3 py-3">Actor</th><th class="px-3 py-3">Action</th><th class="px-3 py-3">Target</th><th class="px-3 py-3">IP</th><th class="px-3 py-3">Device</th></tr></thead>
          <tbody id="logBody" class="divide-y divide-whisper/60"></tbody>
        </table></div>
        <div class="px-6 py-3.5 bg-canvas border-t border-whisper/60 flex items-center justify-between flex-wrap gap-2">
          <p class="text-[11px] text-steel" id="count"></p>
          <p class="text-[11px] text-steel">Showing newest first · 2025/26 session</p>
        </div>
      </section>
    </main>
  </div>
</div>
<script src="../assets/shell.js"></script>
<script>
// [time, actor, role, action, type, target, ip, device, sensitive]
const L=[
 ['20 Jun 14:32','Ustadh Abdullahi','Owner','Published JSS 2A results','Results','JSS 2A · Term 3 · 38 cards','102.89.34.11','Chrome · Windows',1],
 ['20 Jun 13:58','Mrs. Ngozi Adeyemi','Admin','Edited student record','Records','Ibrahim Sani · EIS/2024/0143','102.89.34.22','Chrome · Android',0],
 ['20 Jun 11:47','Mallam Musa Ibrahim','Teacher','Submitted scores for approval','Results','SS 2 Chemistry · Term 3','41.58.120.6','Safari · iPhone',0],
 ['20 Jun 09:15','Ustadh Abdullahi','Owner','Changed fee structure','Finance','JSS tuition ₦82k → ₦85k','102.89.34.11','Chrome · Windows',1],
 ['20 Jun 08:02','Mrs. Ngozi Adeyemi','Admin','Logged in','Auth','—','102.89.34.22','Chrome · Android',0],
 ['19 Jun 16:40','Ustadh Abdullahi','Owner','Suspended user','Users','Temp account · data-clerk-2','102.89.34.11','Chrome · Windows',1],
 ['19 Jun 15:21','Mr. Chinedu Okafor','Teacher','Edited published score','Results','JSS 3B Maths · 1 student','41.58.120.9','Chrome · Windows',1],
 ['19 Jun 12:10','Mrs. Ngozi Adeyemi','Admin','Recorded fee payment','Finance','Receipt #AF-2240 · ₦62,200','102.89.34.22','Chrome · Android',0],
 ['19 Jun 10:33','Ustadh Abdullahi','Owner','Changed role','Users','Mrs. Ngozi → Admin','102.89.34.11','Chrome · Windows',1],
 ['19 Jun 08:01','Mallam Musa Ibrahim','Teacher','Failed login (wrong password)','Auth','3 attempts','41.58.120.6','Safari · iPhone',1],
 ['18 Jun 17:55','Ustadh Abdullahi','Owner','Exported full data','Records','All students · CSV','102.89.34.11','Chrome · Windows',1],
 ['18 Jun 14:08','Mrs. Ngozi Adeyemi','Admin','Marked attendance','Records','JSS 1A · 19 Jun','102.89.34.22','Chrome · Android',0],
];
function typeOf(t){const m={Results:'Results',Records:'Records',Finance:'Finance',Users:'Users',Auth:'Auth'};return m[t];}
function render(){
  const fa=document.getElementById('fActor').value, ft=document.getElementById('fAction').value, q=document.getElementById('fSearch').value.toLowerCase();
  const rows=L.filter(r=>(!fa||r[1]===fa)&&(!ft||r[4]===ft)&&(!q||(r[3]+' '+r[5]+' '+r[6]).toLowerCase().includes(q)));
  document.getElementById('logBody').innerHTML=rows.map(r=>
   `<tr class="${r[8]?'bg-alert/[0.03]':''} hover:bg-wash/30">
     <td class="px-6 py-2.5 font-mono text-steel whitespace-nowrap">${r[0]}</td>
     <td class="px-3 py-2.5"><span class="font-medium">${r[1]}</span><span class="text-[10px] text-steel ml-1.5 bg-canvas ring-1 ring-whisper rounded-full px-1.5 py-0.5">${r[2]}</span></td>
     <td class="px-3 py-2.5"><span class="font-medium ${r[8]?'text-alert':''}">${r[3]}</span>${r[8]?' <span class="text-[10px] font-medium text-alert bg-alert/10 rounded-full px-1.5 py-0.5 ml-1">sensitive</span>':''}</td>
     <td class="px-3 py-2.5 text-steel">${r[5]}</td>
     <td class="px-3 py-2.5 font-mono text-steel">${r[6]}</td>
     <td class="px-3 py-2.5 text-steel">${r[7]}</td></tr>`).join('')||'<tr><td colspan="6" class="px-6 py-8 text-center text-steel">No entries match.</td></tr>';
  document.getElementById('count').textContent=rows.length+' of '+L.length+' entries';
}
render();
</script>
<div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] bg-ink text-white text-[12.5px] font-medium px-4 py-2.5 rounded-xl shadow-lift"></div>
<script>function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.add('hidden')},2200);}</script>
<div title="Edsynk product preview — design mockups, not the live app" style="position:fixed;bottom:14px;right:14px;z-index:99999;background:#0B2A56;color:#fff;font:600 11px/1 -apple-system,system-ui,sans-serif;letter-spacing:.04em;padding:7px 13px;border-radius:999px;box-shadow:0 4px 14px rgba(11,42,86,.35);pointer-events:none">PREVIEW</div>
</body>
</html>
